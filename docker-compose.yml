services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resolveops
      POSTGRES_USER: resolveops
      POSTGRES_PASSWORD: resolveops
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://resolveops:resolveops@db:5432/resolveops
      MOCK_PROVIDERS: "true"
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
