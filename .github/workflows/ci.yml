name: CI

on:
  push:
    branches: [main, complete-v2-portfolio-polish, feature-reliability-metrics]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Typecheck (mypy)
        run: python -m mypy app --ignore-missing-imports
      - name: Tests (pytest)
        run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up -d --build
      - name: Wait for backend readiness
        run: python3 scripts/wait_for_api.py
      - name: Generate sample data
        run: python3 scripts/generate_sample_tickets.py --count 80
      - name: Run V3 reliability smoke validation
        run: python3 scripts/v3_api_smoke.py --base-url http://localhost:8000 --csv scripts/sample_tickets.csv
      - name: Teardown
        if: always()
        run: docker compose down -v
